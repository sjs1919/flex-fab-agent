# flex-fab-agent 反向代理（dev.wzhlink.cn → 127.0.0.1:8000）
# 部署：cp 到 /etc/nginx/sites-enabled/flex-fab-agent.conf 后 nginx -t && reload
server {
    listen 80;
    server_name dev.wzhlink.cn;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name dev.wzhlink.cn;
    ssl_certificate     /etc/nginx/ssl/dev.wzhlink.cn.pem;
    ssl_certificate_key /etc/nginx/ssl/dev.wzhlink.cn.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # 去前缀反代：/flex-fab-agent/ → 应用根（前端资源与 /api 均在子路径下，后端零改动）
    location /flex-fab-agent/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
